name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11, macOS 15, Ubuntu 24.04, …
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: 3.13
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Model
      options:
        - tiny
        - base
        - small
        - medium
        - large-v3
        - turbo
        - not applicable
  - type: textarea
    id: logs
    attributes:
      label: Logs or error text
      render: shell
