name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like the app to do instead?
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Fits this project
      options:
        - label: This stays local/offline (no cloud transcription API)
          required: true
